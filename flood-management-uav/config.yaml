project:
  name: "UAV-Flood-Mapping-Asset-Detection"
  version: "1.0.0"
  device: "cuda"
  seed: 42

paths:
  data_root: "data/real_flood_uav_large"
  yolo_data_root: "data/yolo_detection_large"
  models_dir: "checkpoints"
  output_dir: "outputs"

classes:
  segmentation:
    0: "Background"
    1: "Building Flooded"
    2: "Building Non-Flooded"
    3: "Road Flooded"
    4: "Road Non-Flooded"
    5: "Water"
    6: "Tree"
    7: "Vehicle"
    8: "Pool"
    9: "Grass"

  detection:
    0: "Building"
    1: "Vehicle"

colors:
  # RGB color mappings for semantic visualization
  0: [0, 0, 0]        # Background (Black)
  1: [220, 20, 60]    # Building Flooded (Crimson)
  2: [0, 200, 0]      # Building Non-Flooded (Green)
  3: [255, 140, 0]    # Road Flooded (Dark Orange)
  4: [128, 128, 128]  # Road Non-Flooded (Gray)
  5: [30, 144, 255]   # Water (Dodger Blue)
  6: [34, 139, 34]    # Tree (Forest Green)
  7: [255, 215, 0]    # Vehicle (Gold)
  8: [0, 255, 255]    # Pool (Cyan)
  9: [173, 255, 47]   # Grass (Green-Yellow)

detector:
  model_type: "yolov8s.pt"
  img_size: 640
  batch_size: 16
  epochs: 25
  lr0: 0.002
  conf_threshold: 0.25
  iou_threshold: 0.45
  tiling:
    enabled: true
    tile_size: 1024
    overlap: 0.20

segmentor:
  architecture: "deeplabv3plus"
  backbone: "resnet50"
  in_channels: 3
  num_classes: 10
  img_size: [512, 512]
  batch_size: 16
  epochs: 20
  lr: 0.0005
  loss_type: "focal_dice"
  weight_decay: 0.0001

domain_adaptation:
  # Indian flood-prone region simulation (Assam, Bihar, Kerala, Urban)
  turbidity_simulation:
    enabled: true
    probability: 0.5
    silt_hue_shift: [-15, 10]
    turbidity_saturation_factor: 1.3
    turbidity_value_factor: 0.85
  roof_texture_jitter:
    enabled: true
    probability: 0.4
    contrast_limit: 0.25
    brightness_limit: 0.2
  monsoon_rain_augment:
    enabled: true
    probability: 0.25

impact_assessment:
  submergence_threshold_building: 0.15 # 15% overlap with water classifies building as submerged
  threatened_threshold_building: 0.05  # 5% to 15% indicates perimeter water threat
  vehicle_submerged_threshold: 0.10    # 10% overlap indicates vehicle trapped in flood
  road_severance_threshold: 0.20       # 20% floodwater along road corridor indicates impassable road
  building_threat_buffer_px: 25        # 25-pixel buffer (~5-10m) to assess advancing water fronts
  smoothing:
    gaussian_ksize: 15
    morph_ksize: 7
    water_prob_thresh: 0.40


